apis:
- aid: toronto-hydro:toronto-hydro-green-button-download-my-data
  name: Toronto Hydro Green Button Download My Data
  description: >-
    Toronto Hydro's Green Button Download My Data (DMD) implementation, also required by O. Reg. 633/21
    and built to NAESB REQ.21 ESPI v3.3. A Toronto Hydro customer signs in to their own account and downloads
    their electricity consumption, billing and customer data as a standards-conformant Green Button (ESPI
    XML) file they can hand to any tool they choose. This is a customer-account-gated self-service export
    rather than a programmatic API — there is no anonymous endpoint, no key, and no documented URL pattern
    — but the file it emits is a real, standardized, machine-readable energy-data artifact, which is what
    makes DMD the practical integration path for anyone not willing to complete third-party onboarding
    for CMD.
  humanURL: https://www.torontohydro.com/for-home/green-button
