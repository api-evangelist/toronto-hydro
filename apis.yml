name: Toronto Hydro
kind: company
description: Toronto Hydro is the municipally owned local electricity distribution
  company (LDC) for the City of Toronto, delivering power to roughly 800,000 residential
  and business customers across Canada's largest city. It sits in the wires-and-meters
  layer of Ontario's electricity value chain — it does not generate power and it does
  not run the wholesale market (that is IESO) — so the only customer-facing data it
  owns is smart-meter consumption, billing and account data. Its API posture is a
  clean example of a mandate that produced an implementation but not a developer
  product — Ontario's O. Reg. 633/21 under the Electricity Act, 1998 compelled rate-regulated
  electricity and gas utilities to offer Green Button Download My Data and Connect
  My Data conforming to NAESB REQ.21 ESPI v3.3 by 1 November 2023, and Toronto Hydro
  runs both — customer-facing Download My Data and Connect My Data pages behind its
  account login, a published third-party terms-and-conditions document, and a live
  third-party onboarding portal operated by its platform vendor Savage Data Systems.
  But there is no developer.torontohydro.com, no docs. or api. subdomain, no published
  base URI, no OpenAPI, and no self-serve keys. Consumer data is available only to
  companies that apply, pass a connectivity test and sign the third-party terms; market
  and grid data are not published openly at all. Mandated, implemented, and completely
  gated.
