summary: >-
  Toronto Hydro publishes NO first-party client libraries in any public package registry
  and has no GitHub organization at all — both https://api.github.com/orgs/torontohydro
  and /orgs/toronto-hydro return HTTP 404. That is consistent with the rest of its
  posture: a mandated Green Button surface whose base URI, reference and credentials are
  handed out only after a private onboarding process. No `SDKs` pointer is wired in
  apis.yml because there is no first-party SDK to point at. What does exist is a small
  community tooling layer built by Toronto Hydro customers against the customer portal —
  recorded below as ecosystem context, never as Toronto Hydro software.
