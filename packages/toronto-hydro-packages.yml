ecosystem:
  note: >-
    None of the following is published by Toronto Hydro and every entry is official:
    false. The first group is community tooling written by Toronto Hydro customers against
    the customer portal, which is itself evidence of the gap this profile records — people
    resorted to browser automation because no programmatic access is offered. The second
    group implements the NAESB REQ.21 ESPI / Green Button family that Toronto Hydro's
    mandated Connect My Data surface belongs to.
  community_toronto_hydro:
  - language: python
    registry: pypi
    name: toronto-hydro-green-button
    url: https://pypi.org/project/toronto-hydro-green-button/
    repository: https://github.com/benwebber/toronto-hydro-green-button
    install: pip install toronto-hydro-green-button
    license: MIT
    last_pushed: '2019-12-05'
    description: >-
      Exports Green Button (ESPI) usage data from a Toronto Hydro account by driving the
      customer portal with Selenium and then downloading the report with Requests. Its
      README states plainly that "Toronto Hydro offers a Green Button XML export through
      the customer portal, but does not offer programmatic API access" — an independent
      2019 corroboration of this profile's finding.
    official: false
  - language: javascript
    name: torontohydrotou
    url: https://github.com/fozboz/torontohydrotou
    description: Express app that returns the current Toronto Hydro time-of-use rate.
    official: false
  - language: python
    name: toronto-hydro-exporter
    url: https://github.com/dtrumpfheller/toronto-hydro-exporter
    description: Community exporter for Toronto Hydro usage data.
    official: false
  - language: python
    name: TorontoHydroRateIndicator
    url: https://github.com/ksaj/TorontoHydroRateIndicator
    description: Script that surfaces the current Toronto electricity rate for dashboards.
    official: false
