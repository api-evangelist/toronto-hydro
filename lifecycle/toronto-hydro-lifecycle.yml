roadmap:
  url: null
  published: false
  note: >-
    No API roadmap. https://www.torontohydro.com/roadmap redirects to the account login
    portlet and is not a public roadmap page. The only forward-looking commitments that
    touch this surface are the Ontario regulation itself and Toronto Hydro's rate-regulated
    investment plan at /regulatory-information/our-2025-29-investment-plan, which is a
    capital plan for the wires business, not an API roadmap.
