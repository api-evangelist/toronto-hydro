missing_note: >-
  The harvested document models only ApplicationInformation, Authorization and UsagePoint —
  the registration and consent layer plus the meter anchor. The ESPI resources that carry
  the actual interval consumption values (MeterReading, IntervalBlock, IntervalReading,
  ReadingType and the usage summaries) are NOT defined in this specification, and Toronto
  Hydro publishes no schema for them. They are listed here as a known gap; nothing was
  invented to fill it.
id_prefixes: null
id_prefixes_note: ESPI uses opaque path identifiers and self-referencing URIs; no id scheme is published.
